[project]
name = "mini-jepa"
version = "1.0.0"
description = "A compact JEPA research pipeline for self-supervised visual motion prediction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=11,<13",
    "torch>=2.6,<3",
]

[project.scripts]
mini-jepa = "mini_jepa.cli:main"
mini-jepa-demo = "mini_jepa.demo_server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_jepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
